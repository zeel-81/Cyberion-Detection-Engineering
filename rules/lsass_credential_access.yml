title: Suspicious LSASS Process Access
id: 84f2c1a7-6d53-4b90-9e21-7358ac0f4d62
status: test
description: Detects Sysmon process access events targeting lsass.exe with a suspicious access mask commonly associated with credential dumping activity.
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess: '0x00001010'
  condition: selection
falsepositives:
  - Legitimate security software accessing LSASS
  - Endpoint monitoring and diagnostic tools
  - Authorized credential security testing
level: high
